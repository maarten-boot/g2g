upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # keep the Django version out of responses nginx generates itself
    server_tokens off;

    # STATIC_ROOT, shared with the web container through the "static" volume
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # $http_host keeps the port (8080); with $host django's CSRF origin check fails on every POST
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
