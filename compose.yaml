name: g2g

services:
  db:
    image: postgres:16-bookworm
    # refuses to start after a failed dump restore (see docker/db-restore.sh)
    entrypoint: ["/usr/local/bin/g2g-db-entrypoint.sh"]
    command: ["postgres"] # an entrypoint override drops the image's default command
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-g2g}
      POSTGRES_USER: ${POSTGRES_USER:-g2g}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # on a NEW pgdata volume: restore the one dump in DB_DUMP_DIR (see docker/db-restore.sh);
      # the web container then applies the pending migrations
      - ./docker/db-entrypoint.sh:/usr/local/bin/g2g-db-entrypoint.sh:ro
      - ./docker/db-restore.sh:/docker-entrypoint-initdb.d/10-db-restore.sh:ro
      - ${DB_DUMP_DIR:-./docker/dump}:/dump:ro
    healthcheck:
      # over TCP: during the first init (and a restore) postgres only listens on its socket,
      # so the web container waits until the restore is finished before it migrates
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-g2g} -d $${POSTGRES_DB:-g2g}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10m # a large restore; failures during the start period do not count
      start_interval: 2s
    restart: unless-stopped
    # only expose to the host while you need psql from outside:
    # ports:
    #   - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # inside the container "localhost" is the web container itself; the database is the "db" service.
      # this overrides DJANGO_DATABASE_URL from .env so .env can keep pointing at localhost for local runs.
      DJANGO_DATABASE_URL: psql://${POSTGRES_USER:-g2g}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-g2g}
      # there is no /dev/log (syslog) in the container: log to the console, docker collects it
      DJANGO_LOGGERS_HANDLERS: console
      DJANGO_LOGGERS_HANDLERS_ROOT: console
      DJANGO_LOGGERS_HANDLERS_APP: console
    volumes:
      - static:/app/static
      # the host's CA bundle (public + internal CAs, e.g. the one that signed the AD certificates)
      # on the same path, so LDAP_CA_CERT_FILE in .env works the same on the host and in the container.
      # override with HOST_CA_BUNDLE when the host keeps it elsewhere (e.g. /etc/pki/tls/certs/ca-bundle.crt)
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/ca-certificates.crt:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/static:ro
    ports:
      - "8080:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  static:
